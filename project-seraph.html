<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>SERAPH & CHERUB — Autonomous Aerospace C2 & Planetary Deep-Space Mesh | Emmanuel Oyewole</title>
  <meta name="description" content="SERAPH & CHERUB: Flagship Autonomous Aerospace Command & Control (C2), Real-Time SGP4 Orbital Propagation, Venusian Aerostat Probe Mesh, and Interplanetary Telemetry by Emmanuel Oyewole.">
  <link rel="icon" type="image/svg+xml" href="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg">
  
  <style>
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Text'), local('SF Pro'), local('SFPro'), local('-apple-system');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro';
      src: local('SF Pro Display Bold'), local('SF Pro Bold'), local('SFPro-Bold');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Thin';
      src: local('SF Pro Display Thin'), local('SF Pro Thin'), local('SFPro-Thin');
      font-weight: 100;
      font-style: normal;
    }
    @font-face {
      font-family: 'Aalto';
      src: local('Aalto'), local('Arial Narrow Bold'), local('Arial Narrow');
      font-weight: 400;
      font-style: normal;
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #090807;
    }

    /* 1. LAYOUT & VIEWPORT */
    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: 100%;
      overflow: hidden;
      background: #0a0908;
    }
    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .background.is-visible {
      opacity: 1;
    }
    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 48%, rgba(0, 0, 0, 0.92) 100%);
      pointer-events: none;
    }
    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity 0.45s ease, filter 0.45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* 2. HEADER */
    .header {
      left: max(clamp(16px, 2.5vw, 28px), env(safe-area-inset-left, 16px));
      right: max(clamp(16px, 2.5vw, 28px), env(safe-area-inset-right, 16px));
      top: max(clamp(16px, 2.8vh, 28px), env(safe-area-inset-top, 16px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 999px;
      line-height: 1;
      font-size: 14.5px;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .nav a.active {
      background: #fff;
      color: #000;
      font-weight: 600;
    }
    .nav a:hover:not(.active) {
      background: rgba(255, 255, 255, 0.18);
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      transition: transform 0.2s, background 0.2s;
    }
    .menu:hover {
      transform: scale(1.03);
      background: #f0f4f8;
    }
    .audio-toggle {
      height: 42px;
      width: 42px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #79dce8;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
      transition: background 0.2s, transform 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .audio-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
      border-color: #79dce8;
    }
    .audio-toggle.is-muted {
      color: #8899aa;
      opacity: 0.65;
    }

    .project-badge {
      margin-left: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: rgba(10, 16, 26, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      color: #fff;
      font-size: 12.5px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .project-badge:hover {
      border-color: rgba(121, 220, 232, 0.6);
      background: rgba(14, 24, 38, 0.85);
    }
    .project-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #79dce8;
      box-shadow: 0 0 10px #79dce8;
    }

    /* 3. SIDEBAR PLANET LIST */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
      user-select: none;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: #b0c0d0;
      font-family: 'SF Pro', Arial, sans-serif;
      transition: color 0.2s, transform 0.2s;
      cursor: pointer;
      outline: none;
    }
    .planet-item:hover, .planet-item:focus-visible {
      color: #79dce8;
      transform: translateX(4px);
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    /* 4. 3D PORTAL */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
      letter-spacing: 0.04em;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
      font-weight: 700;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320/350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* 5. CONTENT BOTTOM (ENHANCED PLANETARY MISSION DOSSIER) */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 32px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 36px;
    }
    .planet-headline {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .mission-tag {
      font-family: 'SF Pro', Arial, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #79dce8;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(121, 220, 232, 0.12);
      border: 1px solid rgba(121, 220, 232, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: inline-block;
      transform: translateX(-24px);
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .planet-content h1 {
      font-family: Aalto, 'Arial Narrow', sans-serif;
      font-size: clamp(100px, 18.5vw, 270px);
      font-weight: 400;
      line-height: 0.72;
      margin: 0 0 -0.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
      text-transform: uppercase;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    /* GLOWING READ MORE CALL-TO-ACTION (UNCLUTTERED CELESTIAL VIEWPORT) */
    .planet-cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-bottom: 8px;
      pointer-events: auto;
    }
    .glow-read-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      padding: 14px 28px 14px 22px;
      border-radius: 999px;
      border: 1.5px solid rgba(121, 220, 232, 0.65);
      background: linear-gradient(135deg, rgba(121, 220, 232, 0.18) 0%, rgba(10, 20, 34, 0.85) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      outline: none;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      box-shadow: 0 0 24px rgba(121, 220, 232, 0.35), 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 14px rgba(121, 220, 232, 0.2);
      animation: buttonBreathGlow 3.6s ease-in-out infinite;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, opacity 0.5s ease;
    }
    .experience.content-revealing .glow-read-more-btn,
    body.intro-ready .glow-read-more-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .glow-read-more-btn:hover,
    .glow-read-more-btn:focus-visible {
      background: linear-gradient(135deg, rgba(121, 220, 232, 0.35) 0%, rgba(18, 36, 62, 0.95) 100%);
      border-color: #ffffff;
      box-shadow: 0 0 45px rgba(121, 220, 232, 0.85), 0 12px 38px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(121, 220, 232, 0.45);
      transform: translateY(-3px) scale(1.02);
    }
    .glow-read-more-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* Radar Beacon */
    .glow-beacon {
      position: relative;
      width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .beacon-core {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #79dce8;
      box-shadow: 0 0 10px #79dce8;
    }
    .beacon-ring {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #79dce8;
      animation: beaconRing 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* Button Text Hierarchy */
    .glow-btn-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
      text-align: left;
    }
    .glow-btn-kicker {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #79dce8;
      line-height: 1;
    }
    .glow-btn-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #ffffff;
      line-height: 1.2;
      white-space: nowrap;
    }

    /* Animated Pointing Chevron */
    .glow-arrow {
      font-size: 20px;
      line-height: 1;
      color: #79dce8;
      display: inline-block;
      margin-left: 2px;
      animation: arrowPoint 1.8s ease-in-out infinite;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .glow-read-more-btn:hover .glow-arrow {
      transform: translateX(10px);
      color: #fff;
      text-shadow: 0 0 16px #79dce8;
    }

    @keyframes buttonBreathGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(121, 220, 232, 0.35), 0 8px 30px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(121, 220, 232, 0.18);
        border-color: rgba(121, 220, 232, 0.55);
      }
      50% {
        box-shadow: 0 0 40px rgba(121, 220, 232, 0.72), 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 24px rgba(121, 220, 232, 0.38);
        border-color: rgba(121, 220, 232, 0.95);
        transform: translateY(-2px);
      }
    }

    @keyframes beaconRing {
      0% {
        transform: scale(0.6);
        opacity: 1;
      }
      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    @keyframes arrowPoint {
      0%, 100% {
        transform: translateX(0);
        opacity: 0.85;
        text-shadow: 0 0 8px rgba(121, 220, 232, 0.5);
      }
      50% {
        transform: translateX(8px);
        opacity: 1;
        text-shadow: 0 0 18px #79dce8, 0 0 30px #79dce8;
      }
    }

    /* Screen-reader & legacy DOM facts preservation (Hidden from main viewport) */
    #facts {
      display: none !important;
    }

    /* 6. PRELOADER */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background {
      z-index: 0;
    }
    .preloader.is-background .preloader-shade {
      opacity: 0;
    }

    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 208px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: left 2s cubic-bezier(0.16, 1, 0.3, 1),
                  top 2s cubic-bezier(0.16, 1, 0.3, 1),
                  width 2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-logo.is-docked {
      left: max(clamp(16px, 2.5vw, 28px), env(safe-area-inset-left, 16px));
      top: max(clamp(16px, 2.8vh, 28px), env(safe-area-inset-top, 16px));
      width: 32px;
      transform: translate(0, 0);
      pointer-events: auto;
      cursor: pointer;
    }
    .floating-logo.is-settled {
      position: absolute;
    }

    .preloader-count {
      position: absolute;
      z-index: 21;
      left: 50%;
      top: 50%;
      transform: translate(-50%, calc(-50% + 140px));
      font-family: 'SF Pro Thin', Arial, sans-serif;
      font-size: 58px;
      font-weight: 100;
      letter-spacing: -0.04em;
      opacity: 1;
      transition: opacity 0.75s ease;
      color: #fff;
    }
    .preloader-count.is-leaving {
      opacity: 0;
    }
    .preloader-count .percent {
      font-size: 26px;
      margin-left: 2px;
      opacity: 0.7;
    }

    .scene-canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }

    /* 7. LOADING INDICATOR */
    .loading {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 6;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #79dce8;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      font-weight: 600;
    }
    .experience.is-loading .loading {
      opacity: 1;
    }

    /* 8. CUSTOM CURSOR */
    .custom-cursor {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 50;
      pointer-events: none;
      transform: translate3d(-100px, -100px, 0);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .custom-cursor.is-visible {
      opacity: 1;
    }
    .cursor-dot {
      position: absolute;
      left: 0;
      top: 0;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #79dce8;
      box-shadow: 0 0 10px #79dce8;
      transform: translate(-50%, -50%);
    }
    .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(121, 220, 232, 0.6);
      transform: translate(-50%, -50%);
      transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease;
    }
    .cursor-label {
      position: absolute;
      left: 20px;
      top: -10px;
      font-size: 10.5px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      color: #79dce8;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .custom-cursor.is-enter .cursor-orbit {
      width: 48px;
      height: 48px;
      border-color: #79dce8;
      background: rgba(121, 220, 232, 0.1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
    }

    /* 9. ENTRANCE & TRANSITION PHASES */
    body.intro-ready .portal-heading {
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .experience.content-revealing .planet-content h1,
    body.intro-ready .planet-content h1 {
      opacity: 1;
      transform: translateX(0);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .experience.content-revealing .mission-tag,
    body.intro-ready .mission-tag {
      opacity: 1;
      transform: translateX(0);
    }
    .experience.content-revealing .glow-read-more-btn,
    body.intro-ready .glow-read-more-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition: opacity 0.65s ease 0.2s, transform 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;
    }
    .experience.content-revealing .fact,
    body.intro-ready .fact {
      opacity: 1;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .experience.content-revealing .fact:nth-child(1), body.intro-ready .fact:nth-child(1) { transition-delay: 0.15s; }
    .experience.content-revealing .fact:nth-child(2), body.intro-ready .fact:nth-child(2) { transition-delay: 0.25s; }
    .experience.content-revealing .fact:nth-child(3), body.intro-ready .fact:nth-child(3) { transition-delay: 0.35s; }
    .experience.content-revealing .fact:nth-child(4), body.intro-ready .fact:nth-child(4) { transition-delay: 0.45s; }

    .planet-list.is-switching .planet-item {
      animation: switchTwitch 0.45s ease;
    }
    @keyframes switchTwitch {
      0% { opacity: 0.4; transform: translateX(-6px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* 10. ARCHITECTURAL BRIEFING DRAWER / MODAL */
    .seraph-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(3, 8, 16, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      display: none;
      opacity: 0;
      overflow-y: auto;
      padding: clamp(24px, 4vw, 56px) 20px;
      transition: opacity 0.3s ease;
    }
    .seraph-modal.is-open {
      display: block;
      opacity: 1;
    }
    .seraph-sheet {
      max-width: 1060px;
      margin: 0 auto;
      background: linear-gradient(145deg, rgba(16, 26, 42, 0.94), rgba(8, 14, 24, 0.98));
      border: 1px solid rgba(121, 220, 232, 0.35);
      border-radius: 28px;
      padding: clamp(24px, 4vw, 48px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
    }
    .seraph-close {
      position: absolute;
      right: clamp(18px, 3vw, 32px);
      top: clamp(18px, 3vw, 32px);
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.2s;
    }
    .seraph-close:hover {
      background: #fff;
      color: #000;
      transform: scale(1.05);
    }

    /* MISSION SELECTOR TABS */
    .mission-tabs {
      display: flex;
      flex-wrap: wrap;

      if (!media) return;
      const mw = media.videoWidth || media.naturalWidth || media.width || 1920;
      const mh = media.videoHeight || media.naturalHeight || media.height || 1080;
      if (!mw || !mh) return;

      const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
      const w = mw * scale;
      const h = mh * scale;
      const x = (window.innerWidth - w) / 2;
      const y = (window.innerHeight - h) / 2;
      ctx.drawImage(media, x, y, w, h);

      const points = [];
      const arcs = [
        [ w / 2 - r, -h / 2 + r, -Math.PI / 2, 0 ],
        [ w / 2 - r,  h / 2 - r, 0, Math.PI / 2 ],
        [-w / 2 + r,  h / 2 - r, Math.PI / 2, Math.PI ],
        [-w / 2 + r, -h / 2 + r, Math.PI, Math.PI * 1.5 ]
      ];
      for (let i = 0; i < 4; i++) {
        const [cx, cy, a0, a1] = arcs[i];
        for (let s = 0; s <= 10; s++) {
          const a = a0 + (a1 - a0) * (s / 10);
          points.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
        }
      }
      return points;
    }

      const ax = rx * Math.PI / 180;
      const ay = ry * Math.PI / 180;
      const cosAx = Math.cos(ax), sinAx = Math.sin(ax);
      const cosAy = Math.cos(ay), sinAy = Math.sin(ay);

      return points.map(([x, y]) => {
        const xx = x * cosAy;
        const yy = y * cosAx;
        const z = x * sinAy - y * sinAx;
        const p = 850 / (850 + z);
        return [cx + xx * p, cy + yy * p];
      });
    }

      const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
      const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;

      const baseW = rect.width + (window.innerWidth - rect.width) * e;
      const baseH = rect.height + (window.innerHeight - rect.height) * e;

      const scale = e ? 1 : maskScale;
      const w = baseW * scale;
      const h = baseH * scale;

      const r = 90 * (1 - e) * scale;
      const rx = rotX * (1 - e);
      const ry = rotY * (1 - e);

      if (w > 1 && h > 1) {
        const localPoints = sampleRoundedRect(w, h, r);
        const screenPoints = projectPoints(localPoints, cx, cy, rx, ry);

        portalCtx.save();
        portalCtx.globalAlpha = canvasOpacity;
        portalCtx.beginPath();
        portalCtx.moveTo(screenPoints[0][0], screenPoints[0][1]);
        for (let i = 1; i < screenPoints.length; i++) {
          portalCtx.lineTo(screenPoints[i][0], screenPoints[i][1]);
        }
        portalCtx.closePath();
        portalCtx.clip();

        portalCtx.fillStyle = '#030303';
        portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

        const activeMedia = transitionActive ? transitionVideo : (states[current].image ? portalImg : portalVideo);
        drawCover(portalCtx, activeMedia);

        if (transitionActive) {
          drawShade(portalCtx);
        }

        portalCtx.restore();
      }

      requestAnimationFrame(draw);
    }

    // 8. EASING & INTERPOLATION
    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function animateValue(setter, duration) {
      return new Promise(resolve => {
        const start = performance.now();
        function frame(now) {
          const elapsed = now - start;
          const progress = Math.min(1, elapsed / duration);
          setter(easeInOutCubic(progress));
          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    // 13. PRELOADER DRIVER
    function runPreloader() {
      const preloaderVideo = document.getElementById('preloader-video');
      const preloaderCount = document.getElementById('preloader-count');
      const preloaderVal = document.getElementById('preloader-value');
      const preloader = document.getElementById('preloader');
      const floatingLogo = document.getElementById('floating-logo');

      let finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        preloaderVal.textContent = '100';
        preloaderCount.classList.add('is-leaving');
        floatingLogo.classList.add('is-docked');
        preloader.classList.add('is-background');
        document.body.classList.add('preload-complete');
        startExperience();
        setTimeout(() => {
          if (preloaderCount && preloaderCount.parentNode) preloaderCount.remove();
        }, 750);
        setTimeout(() => {
          floatingLogo.classList.add('is-settled');
        }, 2000);
      }

      if (location.search.includes('skip_preload') || location.hash.includes('skip_preload')) {
        finish();
        return;
      }

      function updateProgress() {
        if (finished) return;
        if (preloaderVideo.duration) {
          const pct = Math.min(99, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
          preloaderVal.textContent = String(pct);
        }
        requestAnimationFrame(updateProgress);
      }

      preloaderVideo.addEventListener('loadedmetadata', () => {
        preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
        const p = preloaderVideo.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => finish());
        }
        requestAnimationFrame(updateProgress);
      });

      preloaderVideo.addEventListener('ended', finish);
      setTimeout(() => { if (!finished) finish(); }, 3800);
    }

        customCursor.classList.add('is-visible');

      orbitX += (cursorX - orbitX) * 0.2;
      orbitY += (cursorY - orbitY) * 0.2;
      customCursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0)`;
      cursorOrbit.style.transform = `translate3d(${orbitX - cursorX}px, ${orbitY - cursorY}px, 0) translate(-50%, -50%)`;

    // 16. WEB AUDIO API TACTICAL SYNTHESIZER
    let audioCtx = null;
    let audioEnabled = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function toggleSeraphAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audio-toggle');
      if (audioEnabled) {
        getAudioContext();
        if (btn) {
          btn.classList.remove('is-muted');
          btn.textContent = '🔊';
        }
        playChimeSound(660, 0.15);
        showSeraphToast('TACTICAL AUDIO SYNTHESIZER: ACTIVE');
      } else {
        if (btn) {
          btn.classList.add('is-muted');
          btn.textContent = '🔈';
        }
        showSeraphToast('TACTICAL AUDIO: MUTED');
      }
    }

    function playClickSound(freq = 880, dur = 0.04) {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e){}
    }

    function playChimeSound(freq = 523.25, dur = 0.3) {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, ctx.currentTime + dur);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e){}
    }

    function playBurnSound() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const dur = 1.2;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + dur);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e){}
    }

    // 17. SGP4 ORBITAL MECHANICS SIMULATION STATE
    const orbitRegimes = {

    function selectOrbit(key) {

    // 18. VENUS ATMOSPHERIC SOUNDING LOGIC
    function updateAtmosphericSounding(altKm) {
      altKm = parseFloat(altKm);
      const display = document.getElementById('venus-alt-display');
      const pressEl = document.getElementById('venus-press');
      const pressSub = document.getElementById('venus-press-sub');
      const tempEl = document.getElementById('venus-temp');
      const tempSub = document.getElementById('venus-temp-sub');
      const acidEl = document.getElementById('venus-acid');
      const windEl = document.getElementById('venus-wind');

      let layer = 'Dense CO₂ Cloud Layer';
      if (altKm < 10) layer = 'Supercritical Basal Troposphere';
      else if (altKm < 30) layer = 'Lower Dust & Sulfuric Haze';
      else if (altKm < 48) layer = 'Dense Lower Cloud Deck';
      else if (altKm <= 60) layer = 'Temperate Cloud Habitation Zone (1 atm, 25°C)';
      else if (altKm < 75) layer = 'Upper Cloud Deck & Acid Mist';
      else layer = 'Upper Mesosphere / Vacuum';

      if (display) display.textContent = `${altKm.toFixed(1)} km (${layer})`;

      // Venusian physics approximations
      const press = 92 * Math.exp(-altKm / 15.9);
      const tempC = Math.max(-100, 465 - (altKm * 8.1));
      let acid = 0;
      if (altKm >= 45 && altKm <= 70) {
        acid = Math.min(85, 40 + (altKm - 45) * 2.5);
      } else if (altKm > 70) {
        acid = Math.max(0, 85 - (altKm - 70) * 4);
      }
      const wind = Math.min(390, Math.max(3, altKm * 6.5));

      if (pressEl) pressEl.textContent = press >= 10 ? `${press.toFixed(1)} bar` : `${press.toFixed(2)} bar`;
      if (pressSub) {
        pressSub.textContent = (altKm >= 50 && altKm <= 58) ? 'Earth Sea-Level Equivalent' : (altKm < 10 ? 'Extreme Supercritical Fluid' : 'Low Atmospheric Pressure');
      }
      if (tempEl) tempEl.textContent = `${tempC > 0 ? '+' : ''}${tempC.toFixed(1)} °C`;
      if (tempSub) {
        tempSub.textContent = (tempC >= 15 && tempC <= 35) ? 'Habitable Thermal Deck' : (tempC > 400 ? 'Melts Lead & Solder (SiC Required)' : 'Cryogenic Mesosphere');
      }
      if (acidEl) acidEl.textContent = `${acid.toFixed(1)}%`;
      if (windEl) windEl.textContent = `${wind.toFixed(0)} km/h`;

      // Update preset pills
      [54, 65, 25, 0].forEach(p => {
        const btn = document.getElementById(`venus-preset-${p}`);
        if (btn) btn.classList.toggle('active', Math.abs(altKm - p) < 3);
      });
    }

    function setVenusAltitude(altKm) {
      const slider = document.getElementById('venus-alt-slider');
      if (slider) slider.value = altKm;
      updateAtmosphericSounding(altKm);
      playClickSound(600, 0.04);
    }

    // 19. ELYRA BENCHMARK SELECTOR
    const elyraModels = {
      qwen: { speed: '28.4 tok/s', ttft: '120 ms', ram: '1.85 GB', ctx: '2,048 Tok' },
      llama: { speed: '58.7 tok/s', ttft: '62 ms', ram: '1.14 GB', ctx: '2,048 Tok' },
      deepseek: { speed: '34.2 tok/s', ttft: '110 ms', ram: '1.40 GB', ctx: '2,048 Tok' }
    };

    function selectElyraModel(key) {
      if (!elyraModels[key]) return;

      ['qwen', 'llama', 'deepseek'].forEach(k => {
        const b = document.getElementById(`elyra-pill-${k}`);
        if (b) b.classList.toggle('active', k === key);
      });
      const m = elyraModels[key];
      const sp = document.getElementById('elyra-speed');
      const tt = document.getElementById('elyra-ttft');
      const rm = document.getElementById('elyra-ram');
      const cx = document.getElementById('elyra-ctx');

      if (tt) tt.textContent = m.ttft;

    // Continuous Real-Time Propagator Clock
    setInterval(() => {
      orbitProgress = (orbitProgress + 0.15) % 100;

      const txt = document.getElementById('orbit-progress-text');
      if (bar) bar.style.width = `${orbitProgress.toFixed(1)}%`;
      if (pct) pct.textContent = `${Math.floor(orbitProgress)}%`;
      if (txt) {
        const nu = (orbitProgress * 3.6).toFixed(1);
        const remM = Math.max(1, Math.floor((100 - orbitProgress) * 0.95));
        const remS = Math.floor(Math.random() * 59);
        txt.textContent = `ORBIT ANOMALY ν: ${nu}° // NEXT GROUND CONTACT IN ${remM}m ${remS}s`;
      }

    function closeSeraphBriefing() {
      const modal = document.getElementById('seraph-modal');
      modal.classList.remove('is-open');
      if (location.hash && (location.hash === '#about' || location.hash === '#explore' || location.hash === '#pitch' || location.hash === '#cherub' || location.hash === '#seraph')) {
        history.replaceState(null, '', location.pathname + location.search);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSeraphBriefing();
    });

    function checkHash() {
      const h = location.hash.toLowerCase();
      const q = location.search.toLowerCase();

      if (q.includes('planet=')) {
        const pMatch = location.search.match(/planet=([a-z]+)/i);
        if (pMatch && pMatch[1]) jumpToPlanet(pMatch[1].toLowerCase(), false);
      }

      if (h === '#cherub' || q.includes('mission=cherub')) {
        jumpToPlanet('venus', false);
      } else if (h === '#seraph' || q.includes('mission=seraph')) {
        jumpToPlanet('earth', false);
      } else if (h === '#elyra' || q.includes('mission=elyra')) {
        jumpToPlanet('mars', false);
      } else if (h === '#planets') {
        cyclePlanet();
      } else if (h === '#mars' || h === '#earth' || h === '#venus') {
        jumpToPlanet(h.replace('#', ''), false);
      }

      if (q.includes('modal=1') || h === '#briefing' || h === '#dossier' || h === '#pitch') {
        let mKey = states[current] && states[current].dossierKey ? states[current].dossierKey : 'seraph';
        if (q.includes('mission=cherub') || h === '#cherub') mKey = 'cherub';
        else if (q.includes('mission=elyra') || h === '#elyra') mKey = 'elyra';
        else if (q.includes('mission=seraph') || h === '#seraph') mKey = 'seraph';
        openSeraphBriefing(mKey);

        if (q.includes('scroll_sim=1')) {
          setTimeout(() => {
            const sim = document.querySelector('.sim-panel');
            if (sim) sim.scrollIntoView({ behavior: 'instant', block: 'start' });
          }, 250);
        }

        if (q.includes('burn=1')) {
          setTimeout(executeAvoidanceBurn, 450);
        }

        const altMatch = q.match(/alt=(\d+)/);
        if (altMatch) {
          setTimeout(() => setVenusAltitude(parseInt(altMatch[1])), 350);
        }
      }
    }
    window.addEventListener('hashchange', checkHash);
    setTimeout(checkHash, 150);

    // 16. BOOT ORDER
    document.querySelectorAll('.backgrounds .background').forEach(v => {
      v.pause();
      v.currentTime = 0;
    });
    resizeCanvas();
    render();
    switchDossier('seraph');
    requestAnimationFrame(draw);
    requestAnimationFrame(cursorLoop);
    runPreloader();

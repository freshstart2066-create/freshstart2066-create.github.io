<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planet Jumping — Immersive Space Portal</title>
  <style>
    @font-face {
      font-family: 'SF Pro';
      font-weight: 400;
      src: local('SF Pro Text'), local('SF Pro'), local('Helvetica Neue'), local('Arial');
    }
    @font-face {
      font-family: 'SF Pro';
      font-weight: 700;
      src: local('SF Pro Text Bold'), local('SF Pro Bold'), local('Helvetica Neue Bold'), local('Arial Bold');
    }
    @font-face {
      font-family: 'SF Pro Thin';
      font-weight: 100;
      src: local('SF Pro Text Thin'), local('SF Pro Thin'), local('Helvetica Neue Thin');
    }
    @font-face {
      font-family: 'Aalto';
      font-weight: 400;
      src: local('Aalto'), local('Arial Narrow'), local('Helvetica Condensed');
    }

    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090807;
    }

    html, body, button, a, .portal {
      cursor: none !important;
    }

    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }

    .backgrounds, .background, .shade, .transition-layer, .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.8s ease;
      width: 100%;
      height: 100%;
    }
    .background.is-visible {
      opacity: 1;
    }

    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
      pointer-events: none;
    }

    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity 0.45s ease, filter 0.45s ease;
    }

    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }

    /* Header */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
      font-size: 15px;
      transition: background 0.2s, color 0.2s;
    }
    .nav a.active {
      background: #fff;
      color: #000;
    }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      font-weight: 500;
      font-size: 15px;
    }

    /* Sidebar Planet List */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.2s;
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active:before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      display: inline-block;
    }

    /* Portal Window */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
    }
    .portal-heading strong {
      font-size: 18px;
      margin-left: 8px;
    }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      box-shadow: none;
      transform: none !important;
    }
    .portal video, .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Planet Content */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: 'Aalto', 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: 0.72;
      margin: 0 0 -0.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
      text-transform: uppercase;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.48);
      opacity: 0;
    }
    .fact:last-child {
      border-bottom: 0;
    }
    .fact dt {
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }
    .fact dd {
      margin: 0;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Preloader */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background {
      z-index: 0;
    }
    .preloader.is-background .preloader-shade {
      opacity: 0;
    }

    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition: left 2s cubic-bezier(0.16, 1, 0.3, 1),
                  top 2s cubic-bezier(0.16, 1, 0.3, 1),
                  width 2s cubic-bezier(0.16, 1, 0.3, 1),
                  height 2s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled {
      z-index: 5;
    }

    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes preload-count-out {
      to {
        opacity: 0;
        filter: blur(7px);
        transform: translate(-50%, -34px);
      }
    }

    /* Custom Cursor */
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .custom-cursor.is-visible {
      opacity: 1;
    }
    body:not(.preload-complete) .custom-cursor {
      opacity: 0 !important;
    }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255, 255, 255, 0.4);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px/1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Entrance & Switch Animations */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact {
      opacity: 0;
    }
    .intro-ready .header {
      animation: reveal-down 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .content-revealing .fact {
      animation: fact-rise 0.72s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .content-revealing .fact:nth-child(1) { animation-delay: 0.52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: 0.68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: 0.84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1.00s; }

    .mask-revealing .portal-heading {
      animation: portal-caption 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row 0.58s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: 0.02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: 0.05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: 0.08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: 0.11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: 0.14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: 0.17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: 0.20s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: 0.23s; }
    .planet-list.is-switching .planet-item.active:before {
      animation: active-dot 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to { opacity: 1; filter: blur(0); transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to { opacity: 1; filter: blur(0); transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to { opacity: 1; filter: blur(0); transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: 0.35; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Misc & Loading */
    .transition-layer { display: none; }
    .scene-canvas { display: none; }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .experience.is-loading .loading {
      opacity: 0.8;
    }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade {
      opacity: 1;
    }
    .experience.is-committing .background {
      transition: none !important;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>

<main class="experience" data-planet="mars" id="experience">
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background" class="background is-visible" muted playsinline preload="auto"></video>
    <video id="earth-background" class="background" muted playsinline preload="auto"></video>
    <video id="venus-background" class="background" muted playsinline preload="auto"></video>
  </div>

  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video" muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>

  <img class="floating-logo" id="floating-logo" src="" alt="Ubernatural">

  <div class="preloader-count" id="preloader-count" aria-live="polite">
    <span id="preloader-value">0</span><span class="percent">%</span>
  </div>

  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>

  <header class="header chrome">
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="index.html">Portfolio</a>
        <a href="nival-identity.html">Identity</a>
        <a href="#explore">Explore</a>
        <a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button" onclick="location.href='index.html'">Main Menu</button>
    </div>
  </header>

  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading" id="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video" muted playsinline preload="auto"></video>
      <img id="portal-image" src="" alt="Mercury" style="display:none;">
    </button>
  </section>

  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <div class="transition-layer" aria-hidden="true">
    <video id="transition-video" muted playsinline preload="auto"></video>
  </div>
  <div class="loading" aria-hidden="true">Preparing orbit…</div>

  <div class="custom-cursor" id="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span>
    <span class="cursor-dot"></span>
    <span class="cursor-label">Enter</span>
  </div>
</main>

<script>
  const BASE = "https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P";
  const ASSETS = {
    MARS_BG:  `${BASE}/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4`,
    TO_EARTH: `${BASE}/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4`,
    TO_VENUS: `${BASE}/b30f64d9-1637-477a-83df-d0fc6461a422.mp4`,
    TO_MARS:  `${BASE}/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4`,
    MERCURY:  `${BASE}/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg`,
    LOGO:     `${BASE}/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg`
  };

  // Wire static URLs
  document.getElementById('mars-background').src = ASSETS.MARS_BG;
  document.getElementById('earth-background').src = ASSETS.TO_EARTH;
  document.getElementById('venus-background').src = ASSETS.TO_VENUS;
  document.getElementById('preloader-video').src = ASSETS.TO_MARS;
  document.getElementById('floating-logo').src = ASSETS.LOGO;
  document.getElementById('portal-image').src = ASSETS.MERCURY;

  const planets = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

  const states = {
    mars: {
      name: 'Mars',
      next: 'Earth',
      number: '[03]',
      portal: ASSETS.TO_EARTH,
      background: 'mars-background',
      facts: [
        ['Distance:', 'About 228 million km (1.5 astronomical units).'],
        ['Year:', 'One Martian year is equal to 687 Earth days.'],
        ['Temperature:', 'Around -60 °C, dropping to -125 °C at the poles in winter.'],
        ['Atmosphere:', 'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
      ]
    },
    earth: {
      name: 'Earth',
      next: 'Venus',
      number: '[02]',
      portal: ASSETS.TO_VENUS,
      background: 'earth-background',
      facts: [
        ['Distance:', '149.6 million km from the Sun.'],
        ['Year:', '365.25 Earth days.'],
        ['Temperature:', 'Average surface temperature around 15 °C.'],
        ['Atmosphere:', 'Mostly nitrogen and oxygen, supporting life and liquid water.']
      ]
    },
    venus: {
      name: 'Venus',
      next: 'Mercury',
      number: '[06]',
      image: ASSETS.MERCURY,
      background: 'venus-background',
      facts: [
        ['Distance:', '108.2 million km from the Sun.'],
        ['Year:', '225 Earth days.'],
        ['Temperature:', 'Around 465 °C — the hottest planet in the Solar System.'],
        ['Atmosphere:', 'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
      ]
    }
  };

  let current = 'mars';
  let isFirstRender = true;
  let busy = false;
  let transitionActive = false;
  let expansion = 0;
  let maskScale = 1;
  let canvasOpacity = 1;
  let rotX = 0, rotY = 0;
  let targetX = 0, targetY = 0;
  let hasFrozenFrame = false;

  const experience = document.getElementById('experience');
  const portalBtn = document.getElementById('portal');
  const portalVideo = document.getElementById('portal-video');
  const portalImage = document.getElementById('portal-image');
  const portalCanvas = document.getElementById('portal-canvas');
  const portalCtx = portalCanvas.getContext('2d');
  const sceneCanvas = document.getElementById('scene-canvas');
  const sceneCtx = sceneCanvas.getContext('2d');
  const transitionVideo = document.getElementById('transition-video');

  function render() {
    const state = states[current];
    experience.setAttribute('data-planet', current);
    document.getElementById('planet-title').textContent = state.name.toUpperCase();
    document.getElementById('next-name').textContent = state.next;
    document.getElementById('next-number').textContent = state.number;
    portalBtn.setAttribute('aria-label', `Travel to ${state.next}`);

    // Build Facts
    const factsEl = document.getElementById('facts');
    factsEl.innerHTML = state.facts.map(([k, v]) => `
      <div class="fact"><dt>${k}</dt><dd>${v}</dd></div>
    `).join('');

    // Build Planet List
    const listEl = document.querySelector('.planet-list');
    listEl.innerHTML = planets.map(p => `
      <span class="planet-item ${p.toLowerCase() === state.name.toLowerCase() ? 'active' : ''}">${p}</span>
    `).join('');

    if (!isFirstRender) {
      listEl.classList.remove('is-switching');
      void listEl.offsetWidth;
      listEl.classList.add('is-switching');
    }

    // Toggle Background Videos
    document.querySelectorAll('.background').forEach(bg => {
      bg.classList.toggle('is-visible', bg.id === state.background);
      if (bg.id === state.background) {
        bg.play().catch(() => {});
      }
    });

    // Toggle Portal Source
    if (state.image) {
      portalImage.style.display = 'block';
      portalVideo.style.display = 'none';
    } else {
      portalImage.style.display = 'none';
      portalVideo.style.display = 'block';
      if (portalVideo.src !== state.portal) {
        portalVideo.src = state.portal;
        portalVideo.load();
        portalVideo.play().catch(() => {});
      }
    }

    isFirstRender = false;
  }

  // ════════════════════════════════════════════════════════════════════
  // 7. THE PORTAL CANVAS ENGINE
  // ════════════════════════════════════════════════════════════════════
  function resizeCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    portalCanvas.width = window.innerWidth * d;
    portalCanvas.height = window.innerHeight * d;
    portalCanvas.style.width = window.innerWidth + 'px';
    portalCanvas.style.height = window.innerHeight + 'px';
    portalCtx.setTransform(d, 0, 0, d, 0, 0);

    if (!hasFrozenFrame) {
      sceneCanvas.width = window.innerWidth * d;
      sceneCanvas.height = window.innerHeight * d;
      sceneCtx.setTransform(d, 0, 0, d, 0, 0);
    }
  }
  window.addEventListener('resize', resizeCanvas);

  function drawCover(ctx, media) {
    if (!media) return;
    const mw = media.videoWidth || media.naturalWidth || media.width || window.innerWidth;
    const mh = media.videoHeight || media.naturalHeight || media.height || window.innerHeight;
    const scale = Math.max(window.innerWidth / mw, window.innerHeight / mh);
    const w = mw * scale;
    const h = mh * scale;
    const x = (window.innerWidth - w) / 2;
    const y = (window.innerHeight - h) / 2;
    ctx.drawImage(media, x, y, w, h);
  }

  function drawShade(ctx) {
    const grad = ctx.createLinearGradient(0, window.innerHeight * 0.52, 0, window.innerHeight);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, window.innerHeight * 0.52, window.innerWidth, window.innerHeight * 0.48);
  }

  // Pointer tilt tracking
  window.addEventListener('pointermove', (e) => {
    if (busy) return;
    targetY = (e.clientX / window.innerWidth - 0.5) * 37.4;
    targetX = (e.clientY / window.innerHeight - 0.5) * -33;
  });
  document.addEventListener('pointerleave', () => {
    targetX = 0;
    targetY = 0;
  });

  // Rounded rectangle sampling & projection
  function buildProjectedPath(ctx, cx, cy, w, h, r, rxDeg, ryDeg) {
    const pts = [];
    const hw = w / 2;
    const hh = h / 2;
    const cr = Math.min(r, hw, hh);

    const corners = [
      { cx: hw - cr, cy: -hh + cr, a1: -Math.PI / 2, a2: 0 },
      { cx: hw - cr, cy: hh - cr, a1: 0, a2: Math.PI / 2 },
      { cx: -hw + cr, cy: hh - cr, a1: Math.PI / 2, a2: Math.PI },
      { cx: -hw + cr, cy: -hh + cr, a1: Math.PI, a2: Math.PI * 1.5 }
    ];

    corners.forEach(c => {
      for (let i = 0; i <= 10; i++) {
        const theta = c.a1 + (c.a2 - c.a1) * (i / 10);
        pts.push({
          x: c.cx + cr * Math.cos(theta),
          y: c.cy + cr * Math.sin(theta)
        });
      }
    });

    const ax = (rxDeg * Math.PI) / 180;
    const ay = (ryDeg * Math.PI) / 180;
    const cosAx = Math.cos(ax), sinAx = Math.sin(ax);
    const cosAy = Math.cos(ay), sinAy = Math.sin(ay);

    ctx.beginPath();
    pts.forEach((pt, i) => {
      const xx = pt.x * cosAy;
      const yy = pt.y * cosAx;
      const z = pt.x * sinAy - pt.y * sinAx;
      const p = 850 / (850 + z);
      const sx = cx + xx * p;
      const sy = cy + yy * p;
      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
  }

  let lastTime = performance.now();
  function draw(now) {
    requestAnimationFrame(draw);
    const dt = Math.min(40, now - lastTime);
    lastTime = now;

    rotX += (targetX - rotX) * Math.min(1, dt * 0.009);
    rotY += (targetY - rotY) * Math.min(1, dt * 0.009);

    portalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    if (hasFrozenFrame) {
      portalCtx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
      drawShade(portalCtx);
    }

    const rect = portalBtn.getBoundingClientRect();
    const rectCx = rect.left + rect.width / 2;
    const rectCy = rect.top + rect.height / 2;

    const e = expansion;
    const cx = rectCx + (window.innerWidth / 2 - rectCx) * e;
    const cy = rectCy + (window.innerHeight / 2 - rectCy) * e;
    const baseW = rect.width + (window.innerWidth - rect.width) * e;
    const baseH = rect.height + (window.innerHeight - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale;
    const h = baseH * scale;
    const r = 90 * (1 - e) * scale;
    const rx = rotX * (1 - e);
    const ry = rotY * (1 - e);

    if (w > 1 && h > 1) {
      portalCtx.save();
      portalCtx.globalAlpha = canvasOpacity;
      buildProjectedPath(portalCtx, cx, cy, w, h, r, rx, ry);
      portalCtx.clip();

      portalCtx.fillStyle = '#030303';
      portalCtx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      const state = states[current];
      const media = transitionActive ? transitionVideo : (state.image ? portalImage : portalVideo);
      drawCover(portalCtx, media);

      if (transitionActive) {
        drawShade(portalCtx);
      }
      portalCtx.restore();
    }
  }

  // ════════════════════════════════════════════════════════════════════
  // 8. TRAVEL TRANSITION ENGINE
  // ════════════════════════════════════════════════════════════════════
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function animateValue(setter, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      function step(now) {
        const elapsed = now - start;
        const progress = Math.min(1, elapsed / duration);
        setter(easeInOutCubic(progress));
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(step);
    });
  }

  function revealMask() {
    experience.classList.remove('mask-revealing');
    void experience.offsetWidth;
    experience.classList.add('mask-revealing');
    maskScale = 0;
    return animateValue(v => { maskScale = v; }, 1050);
  }

  function revealPlanetContent() {
    experience.classList.remove('content-revealing');
    void experience.offsetWidth;
    experience.classList.add('content-revealing');
  }

  async function travel() {
    if (busy || current === 'venus') return;
    busy = true;
    targetX = 0;
    targetY = 0;

    const next = current === 'mars' ? 'earth' : 'venus';
    transitionVideo.src = states[current].portal;
    transitionVideo.load();
    experience.classList.add('is-loading');

    await new Promise(resolve => {
      const timer = setTimeout(resolve, 1600);
      transitionVideo.oncanplaythrough = () => { clearTimeout(timer); resolve(); };
      transitionVideo.onerror = () => { clearTimeout(timer); resolve(); };
    });

    experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
    experience.classList.add('is-transitioning');

    transitionVideo.currentTime = 0;
    transitionVideo.playbackRate = 1.3;
    canvasOpacity = 1;
    transitionActive = true;
    await transitionVideo.play().catch(() => {});

    await animateValue(v => { expansion = v; }, 1100);

    await new Promise(resolve => {
      transitionVideo.onended = resolve;
      setTimeout(resolve, (transitionVideo.duration / 1.3) * 1000 + 200);
    });

    // Freeze frame into scene-canvas
    hasFrozenFrame = true;
    sceneCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    drawCover(sceneCtx, transitionVideo);

    current = next;
    experience.classList.add('is-committing');
    render();

    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    transitionActive = false;
    expansion = 0;
    maskScale = 0;
    canvasOpacity = 1;

    experience.classList.remove('is-transitioning', 'is-committing');

    const maskPromise = revealMask();
    setTimeout(revealPlanetContent, 100);
    await maskPromise;

    setTimeout(() => {
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      hasFrozenFrame = false;
      busy = false;
    }, 450);
  }

  portalBtn.addEventListener('click', travel);

  // ════════════════════════════════════════════════════════════════════
  // 9. CUSTOM CURSOR
  // ════════════════════════════════════════════════════════════════════
  const cursor = document.getElementById('custom-cursor');
  let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
  let curX = mouseX, curY = mouseY;

  window.addEventListener('pointermove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.classList.add('is-visible');
  });
  document.addEventListener('mouseleave', () => {
    cursor.classList.remove('is-visible');
  });

  portalBtn.addEventListener('pointerenter', () => {
    cursor.classList.add('is-enter');
  });
  portalBtn.addEventListener('pointerleave', () => {
    cursor.classList.remove('is-enter');
  });

  function cursorLoop() {
    requestAnimationFrame(cursorLoop);
    curX += (mouseX - curX) * 0.2;
    curY += (mouseY - curY) * 0.2;
    cursor.style.transform = `translate3d(${curX.toFixed(2)}px, ${curY.toFixed(2)}px, 0)`;
  }

  // ════════════════════════════════════════════════════════════════════
  // 6. PRELOADER SEQUENCE
  // ════════════════════════════════════════════════════════════════════
  const preloaderVideo = document.getElementById('preloader-video');
  const preloaderVal = document.getElementById('preloader-value');
  const preloaderCount = document.getElementById('preloader-count');
  const floatingLogo = document.getElementById('floating-logo');
  const preloaderEl = document.getElementById('preloader');

  let preloaderFinished = false;
  function finishPreloader() {
    if (preloaderFinished) return;
    preloaderFinished = true;
    preloaderVal.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogo.classList.add('is-docked');
    preloaderEl.classList.add('is-background');
    document.body.classList.add('preload-complete');

    startExperience();

    setTimeout(() => {
      preloaderCount.remove();
    }, 750);
    setTimeout(() => {
      floatingLogo.classList.add('is-settled');
    }, 2000);
  }

  async function startExperience() {
    await revealMask();
    document.body.classList.add('intro-ready');
    setTimeout(revealPlanetContent, 850);
  }

  function runPreloader() {
    preloaderVideo.addEventListener('loadedmetadata', () => {
      preloaderVideo.playbackRate = Math.max(0.25, preloaderVideo.duration / 3);
      preloaderVideo.play().catch(finishPreloader);
    });

    preloaderVideo.addEventListener('timeupdate', () => {
      if (preloaderVideo.duration) {
        const pct = Math.min(100, Math.round((preloaderVideo.currentTime / preloaderVideo.duration) * 100));
        preloaderVal.textContent = pct;
      }
    });

    preloaderVideo.addEventListener('ended', finishPreloader);
    setTimeout(finishPreloader, 4000); // Safety fallback
  }

  // ════════════════════════════════════════════════════════════════════
  // 12. BOOT ORDER
  // ════════════════════════════════════════════════════════════════════
  document.querySelectorAll('.background').forEach(v => {
    v.pause();
    v.currentTime = 0;
  });

  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();
</script>
</body>
</html>
